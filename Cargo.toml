[package]
name = "nj-whip"
version = "0.6.0"
edition = "2021"
description = "An on-screen whip for Claude Code on Windows: swing it, it cracks and types a short message that steers how Claude works."
license = "MIT"
repository = "https://github.com/NJ-Burrito/NJ-Whip"
homepage = "https://nj-burrito.github.io/NJ-Whip/"
readme = "README.md"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
fastrand = "2"
global-hotkey = "0.10.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
rfd = { version = "0.15", default-features = false }
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3", "wav", "flac", "vorbis"] }
skrifa = "0.44"
serde = { version = "1", features = ["derive"] }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd", "png-format"] }
toml = "0.8"
tray-icon = { version = "0.26", default-features = false } # Windows-only app: no Linux gtk3/libappindicator (drops glib 0.18 + proc-macro-error advisories)
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinInet",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Com_Urlmon",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
unicode-bidi = "0.3.18"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Small exe, fast frames: everything is built for size except this crate and the rasteriser.
[profile.release.package."*"]
opt-level = "z"

[profile.release.package.tiny-skia]
opt-level = 3

[profile.release.package.tiny-skia-path]
opt-level = 3
